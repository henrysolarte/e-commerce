services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: ./back
    envVars:
      - key: DATABASE_URL
        scope: build
      - key: DATABASE_URL
        scope: runtime
      - key: PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: prod
