spring.application.name=ecommerce
server.port=${PORT:8081}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Database configuration - convert Render's DATABASE_URL to JDBC format
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Disable initial schema validation to work around Render connectivity issues
spring.jpa.properties.hibernate.check_nullability=false
spring.jpa.properties.hibernate.generate_statistics=false
# Connection pool tuning for containers
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
logging.level.root=INFO
logging.level.com.parquesoft=DEBUG
