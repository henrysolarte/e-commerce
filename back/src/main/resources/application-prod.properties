spring.application.name=ecommerce
server.port=${PORT:8081}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Database configuration is handled by DataSourceConfig bean which
# converts Render's DATABASE_URL environment variable to JDBC format
# No spring.datasource.* properties needed in Render environment
logging.level.root=INFO
logging.level.com.parquesoft=DEBUG
