<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>Test Registro - Clemmens</h2>
    
    <form id="testForm">
      <div class="mb-3">
        <label for="name">Nombre</label>
        <input type="text" class="form-control" id="name" value="Test User" required>
      </div>
      <div class="mb-3">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" value="test@example.com" required>
      </div>
      <div class="mb-3">
        <label for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" value="password123" required>
      </div>
      <button type="submit" class="btn btn-primary">Registrar</button>
    </form>

    <div id="result" class="mt-4" style="display:none;"></div>
  </div>

  <script>
    document.getElementById('testForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const resultDiv = document.getElementById('result');

      try {
        const response = await fetch('http://localhost:8081/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();
        
        resultDiv.innerHTML = `
          <div class="alert alert-${response.ok ? 'success' : 'danger'}">
            <strong>Status: ${response.status}</strong><br>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          </div>
        `;
        resultDiv.style.display = 'block';
      } catch (error) {
        resultDiv.innerHTML = `<div class="alert alert-danger"><strong>Error:</strong> ${error.message}</div>`;
        resultDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
